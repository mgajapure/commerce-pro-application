<div class="p-6 max-w-4xl mx-auto space-y-6">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Store Details</h1>
    <p class="text-sm text-gray-500 mt-1">Configure your store information and preferences</p>
  </div>

  @if (success()) {
    <div class="px-4 py-3 rounded-xl bg-green-50 border border-green-200 text-green-800 text-sm">Store settings saved successfully.</div>
  }
  @if (error()) {
    <div class="px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm">{{ error() }}</div>
  }

  @if (loading()) {
    <div class="text-center py-12 text-gray-500">Loading store settings...</div>
  } @else {
    <!-- Basic Info -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-5">
      <h2 class="text-lg font-semibold text-gray-900">Basic Information</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Store Name</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="storeName()" (ngModelChange)="storeName.set($event)">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                    [ngModel]="description()" (ngModelChange)="description.set($event)"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="phone()" (ngModelChange)="phone.set($event)">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="email()" (ngModelChange)="email.set($event)">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Logo URL</label>
          <input type="url" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="logoUrl()" (ngModelChange)="logoUrl.set($event)" placeholder="https://...">
        </div>
      </div>
    </div>

    <!-- Address -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-5">
      <h2 class="text-lg font-semibold text-gray-900">Address</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="street()" (ngModelChange)="street.set($event)">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="city()" (ngModelChange)="city.set($event)">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">State / Province</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="state()" (ngModelChange)="state.set($event)">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ZIP / Postal Code</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="zip()" (ngModelChange)="zip.set($event)">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
          <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                 [ngModel]="country()" (ngModelChange)="country.set($event)">
        </div>
      </div>
    </div>

    <!-- Commerce Settings -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-5">
      <h2 class="text-lg font-semibold text-gray-900">Commerce Settings</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
          <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                  [ngModel]="currency()" (ngModelChange)="currency.set($event)">
            @for (c of currencies(); track c.code) {
              <option [value]="c.code">{{ c.name }}</option>
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Weight Unit</label>
          <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                  [ngModel]="weightUnit()" (ngModelChange)="weightUnit.set($event)">
            @for (u of weightUnits(); track u) { <option [value]="u">{{ u }}</option> }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Dimension Unit</label>
          <select class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500"
                  [ngModel]="dimensionUnit()" (ngModelChange)="dimensionUnit.set($event)">
            @for (u of dimensionUnits(); track u) { <option [value]="u">{{ u }}</option> }
          </select>
        </div>
      </div>
      <label class="flex items-center gap-3">
        <input type="checkbox" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
               [ngModel]="taxIncluded()" (ngModelChange)="taxIncluded.set($event)">
        <span class="text-sm text-gray-700">Prices include tax</span>
      </label>
    </div>

    <button (click)="save()" [disabled]="saving()"
            class="px-6 py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-xl hover:bg-indigo-700 disabled:opacity-50">
      {{ saving() ? 'Saving...' : 'Save Store Settings' }}
    </button>
  }
</div>
