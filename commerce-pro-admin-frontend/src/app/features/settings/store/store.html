<div class="min-h-screen bg-gray-50/50 p-4 sm:p-6 lg:p-8">
  <div class="max-w-[1600px] mx-auto space-y-6">

    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Store Details</h1>
        <p class="text-gray-500 mt-1 text-sm">Configure your store information and preferences</p>
      </div>
      <div class="flex items-center gap-3">
        <button (click)="showHelp.set(true)" class="p-2.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors" title="Help"><i class="bi bi-question-circle text-lg"></i></button>
        <button (click)="save()" [disabled]="saving()"
          class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition-all flex items-center gap-2 shadow-lg shadow-indigo-200 disabled:opacity-50">
          @if (saving()) { <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> }
          <i class="bi bi-check-lg"></i> Save Changes
        </button>
      </div>
    </div>

    @if (loading()) {
      <div class="space-y-4">
        @for (i of [1,2,3]; track i) {
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 animate-pulse">
            <div class="h-5 bg-gray-200 rounded w-40 mb-4"></div>
            <div class="grid grid-cols-2 gap-4"><div class="h-10 bg-gray-200 rounded-xl"></div><div class="h-10 bg-gray-200 rounded-xl"></div></div>
          </div>
        }
      </div>
    } @else {
      <!-- Basic Information -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-shop text-indigo-500"></i> Basic Information</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="md:col-span-2">
            <app-tooltip-label label="Store Name" tooltip="The name of your store displayed to customers" [required]="true"></app-tooltip-label>
            <input type="text" [ngModel]="storeName()" (ngModelChange)="storeName.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="My Commerce Store">
          </div>
          <div class="md:col-span-2">
            <app-tooltip-label label="Description" tooltip="A brief description of your store"></app-tooltip-label>
            <textarea rows="2" [ngModel]="description()" (ngModelChange)="description.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Your one-stop shop for everything"></textarea>
          </div>
          <div>
            <app-tooltip-label label="Phone" tooltip="Store contact phone number"></app-tooltip-label>
            <input type="tel" [ngModel]="phone()" (ngModelChange)="phone.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="+1 (555) 000-0000">
          </div>
          <div>
            <app-tooltip-label label="Email" tooltip="Store contact email address"></app-tooltip-label>
            <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="store@example.com">
          </div>
          <div class="md:col-span-2">
            <app-tooltip-label label="Logo URL" tooltip="URL to your store logo image"></app-tooltip-label>
            <input type="url" [ngModel]="logoUrl()" (ngModelChange)="logoUrl.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="https://example.com/logo.png">
          </div>
        </div>
      </div>

      <!-- Address -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-geo-alt text-indigo-500"></i> Address</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="md:col-span-2">
            <app-tooltip-label label="Street" tooltip="Street address of your store"></app-tooltip-label>
            <input type="text" [ngModel]="street()" (ngModelChange)="street.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="123 Commerce St">
          </div>
          <div>
            <app-tooltip-label label="City" tooltip="City where your store is located"></app-tooltip-label>
            <input type="text" [ngModel]="city()" (ngModelChange)="city.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <app-tooltip-label label="State / Province" tooltip="State or province"></app-tooltip-label>
            <input type="text" [ngModel]="state()" (ngModelChange)="state.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <app-tooltip-label label="ZIP / Postal Code" tooltip="Postal or ZIP code"></app-tooltip-label>
            <input type="text" [ngModel]="zip()" (ngModelChange)="zip.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <app-tooltip-label label="Country" tooltip="Country of your store"></app-tooltip-label>
            <input type="text" [ngModel]="country()" (ngModelChange)="country.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </div>

      <!-- Commerce Settings -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-currency-exchange text-indigo-500"></i> Commerce Settings</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div>
            <app-tooltip-label label="Currency" tooltip="Default currency for product prices"></app-tooltip-label>
            <select [ngModel]="currency()" (ngModelChange)="currency.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              @for (c of currencies; track c.code) { <option [value]="c.code">{{ c.name }}</option> }
            </select>
          </div>
          <div>
            <app-tooltip-label label="Weight Unit" tooltip="Default unit for product weights"></app-tooltip-label>
            <select [ngModel]="weightUnit()" (ngModelChange)="weightUnit.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              @for (u of weightUnits; track u) { <option [value]="u">{{ u }}</option> }
            </select>
          </div>
          <div>
            <app-tooltip-label label="Dimension Unit" tooltip="Default unit for product dimensions"></app-tooltip-label>
            <select [ngModel]="dimensionUnit()" (ngModelChange)="dimensionUnit.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              @for (u of dimensionUnits; track u) { <option [value]="u">{{ u }}</option> }
            </select>
          </div>
        </div>
        <div class="mt-5">
          <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
            <div>
              <span class="text-sm font-medium text-gray-900">Prices Include Tax</span>
              <p class="text-xs text-gray-500 mt-0.5">Display product prices with tax already included</p>
            </div>
            <div class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" [checked]="taxIncluded()" (change)="taxIncluded.set(!taxIncluded())">
              <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
          </label>
        </div>
      </div>
    }

    <app-help-sidebar [isOpen]="showHelp()" title="Store Settings Help" [sections]="helpSections" (closed)="showHelp.set(false)"></app-help-sidebar>
  </div>
</div>
