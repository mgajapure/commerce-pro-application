<div class="min-h-screen bg-gray-50/50 p-4 sm:p-6 lg:p-8">
  <div class="max-w-[1600px] mx-auto space-y-6">

    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">General Settings</h1>
        <p class="text-gray-500 mt-1 text-sm">Configure your site's basic information and preferences</p>
      </div>
      <div class="flex items-center gap-3">
        <button (click)="showHelp.set(true)" class="p-2.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors" title="Help"><i class="bi bi-question-circle text-lg"></i></button>
        <button (click)="save()" [disabled]="saving()"
          class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition-all flex items-center gap-2 shadow-lg shadow-indigo-200 disabled:opacity-50">
          @if (saving()) { <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> }
          <i class="bi bi-check-lg"></i> Save Changes
        </button>
      </div>
    </div>

    @if (loading()) {
      <div class="space-y-4">
        @for (i of [1,2,3]; track i) {
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 animate-pulse">
            <div class="h-5 bg-gray-200 rounded w-40 mb-4"></div>
            <div class="grid grid-cols-2 gap-4"><div class="h-10 bg-gray-200 rounded-xl"></div><div class="h-10 bg-gray-200 rounded-xl"></div></div>
          </div>
        }
      </div>
    } @else {
      <!-- Site Information -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-globe text-indigo-500"></i> Site Information</h2>
        <div class="space-y-5">
          <div>
            <app-tooltip-label label="Site Name" tooltip="The name displayed in the browser tab and header"></app-tooltip-label>
            <input type="text" [ngModel]="siteName()" (ngModelChange)="siteName.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="My Commerce Store">
          </div>
          <div>
            <app-tooltip-label label="Tagline" tooltip="A short description displayed below the site name"></app-tooltip-label>
            <input type="text" [ngModel]="tagline()" (ngModelChange)="tagline.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Your one-stop shop for everything">
          </div>
        </div>
      </div>

      <!-- Regional Settings -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-geo-alt text-indigo-500"></i> Regional Settings</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <div>
            <app-tooltip-label label="Timezone" tooltip="Default timezone for date/time display"></app-tooltip-label>
            <select [ngModel]="timezone()" (ngModelChange)="timezone.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              @for (tz of timezones; track tz) { <option [value]="tz">{{ tz }}</option> }
            </select>
          </div>
          <div>
            <app-tooltip-label label="Date Format" tooltip="How dates are displayed across the platform"></app-tooltip-label>
            <select [ngModel]="dateFormat()" (ngModelChange)="dateFormat.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              @for (fmt of dateFormats; track fmt) { <option [value]="fmt">{{ fmt }}</option> }
            </select>
          </div>
          <div>
            <app-tooltip-label label="Default Language" tooltip="Primary language for the storefront"></app-tooltip-label>
            <select [ngModel]="defaultLanguage()" (ngModelChange)="defaultLanguage.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              @for (lang of languages; track lang.code) { <option [value]="lang.code">{{ lang.name }}</option> }
            </select>
          </div>
        </div>
      </div>

      <!-- Maintenance Mode -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-tools text-indigo-500"></i> Maintenance Mode</h2>
        <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
          <div>
            <span class="text-sm font-medium text-gray-900">Enable Maintenance Mode</span>
            <p class="text-xs text-gray-500 mt-0.5">Visitors will see a maintenance page instead of your store</p>
          </div>
          <div class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" [checked]="maintenanceMode()" (change)="maintenanceMode.set(!maintenanceMode())">
            <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
          </div>
        </label>
        @if (maintenanceMode()) {
          <div class="mt-4">
            <app-tooltip-label label="Maintenance Message" tooltip="Message shown to visitors during maintenance"></app-tooltip-label>
            <textarea [ngModel]="maintenanceMessage()" (ngModelChange)="maintenanceMessage.set($event)" rows="3"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
              placeholder="We are currently performing scheduled maintenance. Please check back soon."></textarea>
          </div>
        }
      </div>
    }

    <app-help-sidebar [isOpen]="showHelp()" title="General Settings Help" [sections]="helpSections" (closed)="showHelp.set(false)"></app-help-sidebar>
  </div>
</div>
