<div class="min-h-screen bg-gray-50/50 p-4 sm:p-6 lg:p-8">
  <div class="max-w-[1600px] mx-auto space-y-6">

    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Checkout Settings</h1>
        <p class="text-gray-500 mt-1 text-sm">Configure the checkout experience for your customers</p>
      </div>
      <div class="flex items-center gap-3">
        <button (click)="showHelp.set(true)" class="p-2.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors" title="Help"><i class="bi bi-question-circle text-lg"></i></button>
        <button (click)="save()" [disabled]="saving()"
          class="px-4 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-700 transition-all flex items-center gap-2 shadow-lg shadow-indigo-200 disabled:opacity-50">
          @if (saving()) { <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> }
          <i class="bi bi-check-lg"></i> Save Changes
        </button>
      </div>
    </div>

    @if (loading()) {
      <div class="space-y-4">
        @for (i of [1,2,3]; track i) {
          <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 animate-pulse">
            <div class="h-5 bg-gray-200 rounded w-40 mb-4"></div>
            <div class="grid grid-cols-2 gap-4"><div class="h-10 bg-gray-200 rounded-xl"></div><div class="h-10 bg-gray-200 rounded-xl"></div></div>
          </div>
        }
      </div>
    } @else {
      <!-- General Options -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-cart-check text-indigo-500"></i> General Options</h2>
        <div class="space-y-3">
          <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
            <div>
              <span class="text-sm font-medium text-gray-900">Allow Guest Checkout</span>
              <p class="text-xs text-gray-500 mt-0.5">Customers can checkout without creating an account</p>
            </div>
            <div class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" [checked]="guestCheckoutEnabled()" (change)="guestCheckoutEnabled.set(!guestCheckoutEnabled())">
              <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
          </label>
          <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
            <div>
              <span class="text-sm font-medium text-gray-900">Order Confirmation Email</span>
              <p class="text-xs text-gray-500 mt-0.5">Send an email confirmation after order placement</p>
            </div>
            <div class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" [checked]="orderConfirmationEmail()" (change)="orderConfirmationEmail.set(!orderConfirmationEmail())">
              <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
          </label>
          <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
            <div>
              <span class="text-sm font-medium text-gray-900">Require Terms & Conditions</span>
              <p class="text-xs text-gray-500 mt-0.5">Customers must accept terms before completing checkout</p>
            </div>
            <div class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" [checked]="termsRequired()" (change)="termsRequired.set(!termsRequired())">
              <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
          </label>
          <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
            <div>
              <span class="text-sm font-medium text-gray-900">Allow Order Notes</span>
              <p class="text-xs text-gray-500 mt-0.5">Customers can add special instructions to their orders</p>
            </div>
            <div class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" [checked]="orderNotesEnabled()" (change)="orderNotesEnabled.set(!orderNotesEnabled())">
              <div class="w-11 h-6 bg-gray-200 peer-focus:ring-2 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            </div>
          </label>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5">
          <div>
            <app-tooltip-label label="Minimum Order Amount" tooltip="The minimum total required to complete checkout"></app-tooltip-label>
            <input type="number" min="0" [ngModel]="minOrderAmount()" (ngModelChange)="minOrderAmount.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <app-tooltip-label label="Maximum Order Amount" tooltip="The maximum total allowed per single order"></app-tooltip-label>
            <input type="number" min="0" [ngModel]="maxOrderAmount()" (ngModelChange)="maxOrderAmount.set($event)"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>
      </div>

      <!-- Payment Methods -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-credit-card text-indigo-500"></i> Payment Methods</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
          @for (pm of allPaymentMethods; track pm.key) {
            <label class="flex items-center gap-3 p-4 border rounded-xl cursor-pointer hover:bg-gray-50 transition-colors"
              [class.border-indigo-300]="paymentMethods()[pm.key]" [class.bg-indigo-50]="paymentMethods()[pm.key]">
              <input type="checkbox" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" [checked]="paymentMethods()[pm.key]" (change)="togglePayment(pm.key)">
              <i class="bi {{ pm.icon }} text-gray-500"></i>
              <span class="text-sm font-medium text-gray-700">{{ pm.label }}</span>
            </label>
          }
        </div>
      </div>

      <!-- Shipping Methods -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="bi bi-truck text-indigo-500"></i> Shipping Methods</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          @for (sm of allShippingMethods; track sm.key) {
            <label class="flex items-center gap-3 p-4 border rounded-xl cursor-pointer hover:bg-gray-50 transition-colors"
              [class.border-indigo-300]="shippingMethods()[sm.key]" [class.bg-indigo-50]="shippingMethods()[sm.key]">
              <input type="checkbox" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" [checked]="shippingMethods()[sm.key]" (change)="toggleShipping(sm.key)">
              <i class="bi {{ sm.icon }} text-gray-500"></i>
              <span class="text-sm font-medium text-gray-700">{{ sm.label }}</span>
            </label>
          }
        </div>
      </div>
    }

    <app-help-sidebar [isOpen]="showHelp()" title="Checkout Settings Help" [sections]="helpSections" (closed)="showHelp.set(false)"></app-help-sidebar>
  </div>
</div>
