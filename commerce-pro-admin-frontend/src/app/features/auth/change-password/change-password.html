<div class="min-h-screen bg-gray-50/50 p-4 sm:p-6 lg:p-8 flex items-center justify-center">
  <div class="max-w-[520px] w-full space-y-6">
    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
      <h1 class="text-2xl font-bold text-gray-900">Change Password</h1>
      <p class="text-gray-500 mt-1 text-sm">Your password must be changed before you can continue.</p>
    </div>

    <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm space-y-4">
      <div>
        <label class="text-sm font-medium text-gray-700">Current Password</label>
        <input type="password" class="mt-1 w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" placeholder="••••••••" />
      </div>

      <div>
        <label class="text-sm font-medium text-gray-700">New Password</label>
        <input type="password" class="mt-1 w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" placeholder="••••••••" />
      </div>

      <div>
        <label class="text-sm font-medium text-gray-700">Confirm New Password</label>
        <input type="password" class="mt-1 w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" placeholder="••••••••" />
      </div>

      @if (errorMessage()) {
        <div class="px-3 py-2 rounded-xl bg-red-100 text-red-700 text-sm">{{ errorMessage() }}</div>
      }
      @if (successMessage()) {
        <div class="px-3 py-2 rounded-xl bg-green-100 text-green-700 text-sm">{{ successMessage() }}</div>
      }

      <div class="flex gap-3">
        <button (click)="submit()" [disabled]="isLoading()" class="flex-1 px-4 py-2.5 bg-indigo-600 text-white rounded-xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 disabled:opacity-50 text-sm font-medium">
          {{ isLoading() ? 'Changing...' : 'Change Password' }}
        </button>
        <button (click)="cancel()" [disabled]="isLoading()" class="px-4 py-2.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 disabled:opacity-50 text-sm font-medium">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
