<div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm h-full">
    <div class="flex items-center justify-between mb-4">
        <div>
            <h3 class="text-sm font-semibold text-gray-900">New Customers</h3>
            <p class="text-xs text-gray-400 mt-0.5">vs previous period</p>
        </div>
        <div class="w-9 h-9 bg-emerald-100 rounded-xl flex items-center justify-center">
            <i class="bi bi-person-plus text-emerald-600 text-sm"></i>
        </div>
    </div>
    @if (isLoading()) {
        <div class="animate-pulse">
            <div class="h-8 bg-gray-200 rounded w-24 mb-2"></div>
            <div class="h-4 bg-gray-200 rounded w-32"></div>
        </div>
    } @else {
        <div class="text-3xl font-bold text-gray-900">+{{ newCustomersCount() | number }}</div>
        <div class="flex items-center gap-1.5 mt-2">
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full"
                [class]="customerGrowth() >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
                {{ customerGrowth() >= 0 ? '+' : '' }}{{ customerGrowth() }}%
            </span>
            <span class="text-xs text-gray-400">{{ totalCustomers() | number }} total</span>
        </div>
        <a routerLink="/customers" class="mt-3 flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-700 font-medium">
            View all customers <i class="bi bi-arrow-right text-xs"></i>
        </a>
    }
</div>
