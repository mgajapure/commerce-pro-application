@if (isOpen) {
  <div class="fixed inset-0 z-50 flex justify-end">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" (click)="close()"></div>
    <div class="relative w-full max-w-md bg-white shadow-xl flex flex-col animate-slide-in">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-gradient-to-r from-indigo-50 to-white">
        <div>
          <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
            <i class="bi bi-question-circle-fill text-indigo-600"></i>
            {{ title }}
          </h2>
          @if (subtitle) {
            <p class="text-xs text-gray-500 mt-0.5">{{ subtitle }}</p>
          }
        </div>
        <button (click)="close()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition-colors">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <!-- Content -->
      <div class="flex-1 overflow-y-auto p-6 space-y-5">
        @for (section of sections; track section.title) {
          <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
            <h3 class="text-sm font-semibold text-gray-900 mb-2 flex items-center gap-2">
              <i class="bi bi-info-circle text-indigo-500"></i>
              {{ section.title }}
            </h3>
            <p class="text-sm text-gray-600 leading-relaxed">{{ section.content }}</p>
          </div>
        }

        @if (sections.length === 0) {
          <div class="text-center py-8">
            <div class="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3">
              <i class="bi bi-book text-gray-400 text-xl"></i>
            </div>
            <p class="text-sm text-gray-500">No help content available.</p>
          </div>
        }
      </div>
    </div>
  </div>
}
