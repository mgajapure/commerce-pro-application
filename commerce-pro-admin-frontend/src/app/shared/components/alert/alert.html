<!-- ── Toast Stack ─────────────────────────────────────────────────────────── -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-3 w-[360px] pointer-events-none">
  @for (toast of alertSvc.toasts(); track toast.id) {
  <div
    class="pointer-events-auto relative flex rounded-2xl overflow-hidden border border-2 bg-white shadow-2xl shadow-black/50 transition-all duration-300 ease-out"
    [class.opacity-0]="leavingIds().includes(toast.id)" [class.translate-x-4]="leavingIds().includes(toast.id)"
    [class.border-emerald-200]="toast.type === 'success'" [class.border-red-200]="toast.type === 'error'"
    [class.border-amber-200]="toast.type === 'warning'" [class.border-indigo-200]="toast.type === 'info'">

    <!-- Left colour bar -->
    <!-- <div class="w-3 shrink-0 rounded-3xl" [class.bg-emerald-500]="toast.type === 'success'"
      [class.bg-red-500]="toast.type === 'error'" [class.bg-amber-400]="toast.type === 'warning'"
      [class.bg-indigo-500]="toast.type === 'info'"></div> -->

    <div class="flex flex-1 items-start gap-3 p-4">
      <!-- Icon -->
      <i class="text-xl shrink-0 mt-0.5 bi" [class.bi-check-circle-fill]="toast.type === 'success'"
        [class.text-emerald-500]="toast.type === 'success'" [class.bi-x-circle-fill]="toast.type === 'error'"
        [class.text-red-500]="toast.type === 'error'" [class.bi-exclamation-triangle-fill]="toast.type === 'warning'"
        [class.text-amber-500]="toast.type === 'warning'" [class.bi-info-circle-fill]="toast.type === 'info'"
        [class.text-indigo-500]="toast.type === 'info'"></i>

      <!-- Text -->
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold" [class.text-emerald-800]="toast.type === 'success'"
          [class.text-red-800]="toast.type === 'error'" [class.text-amber-800]="toast.type === 'warning'"
          [class.text-indigo-800]="toast.type === 'info'">{{ toast.title }}</p>
        @if (toast.message) {
        <p class="text-xs text-gray-500 mt-0.5 leading-relaxed">{{ toast.message }}</p>
        }
      </div>

      <!-- Dismiss button -->
      <button (click)="dismiss(toast.id)"
        class="shrink-0 w-6 h-6 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors -mt-0.5 -mr-0.5">
        <i class="bi bi-x text-base leading-none"></i>
      </button>
    </div>

    <!-- Progress bar -->
    @if (toast.duration > 0) {
    <div class="absolute bottom-0 left-0 right-0 h-1 bg-black/10 rounded-b-2xl">
      <div class="h-full" [class.bg-emerald-500]="toast.type === 'success'" [class.bg-red-500]="toast.type === 'error'"
        [class.bg-amber-400]="toast.type === 'warning'" [class.bg-indigo-500]="toast.type === 'info'"
        [style]="'animation: shrink ' + toast.duration + 'ms linear forwards'">
      </div>
    </div>
    }
  </div>
  }
</div>

<!-- ── Confirm Dialog ──────────────────────────────────────────────────────── -->
@if (alertSvc.confirmState()) {
@let state = alertSvc.confirmState()!;
<div class="fixed inset-0 z-[9998] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"
  (click)="confirm(false)">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden"
    style="animation: scale-in 0.18s ease-out forwards" (click)="$event.stopPropagation()">

    <!-- Icon + text -->
    <div class="px-6 pt-7 pb-4 flex flex-col items-center text-center">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-4" [class.bg-red-100]="state.danger"
        [class.bg-indigo-100]="!state.danger">
        <i class="text-2xl bi" [class.bi-exclamation-triangle-fill]="state.danger" [class.text-red-600]="state.danger"
          [class.bi-question-circle-fill]="!state.danger" [class.text-indigo-600]="!state.danger"></i>
      </div>
      <h3 class="text-base font-bold text-gray-900 mb-1">{{ state.title }}</h3>
      <p class="text-sm text-gray-500 leading-relaxed">{{ state.message }}</p>
    </div>

    <!-- Buttons -->
    <div class="px-6 pb-6 flex gap-3">
      <button (click)="confirm(false)"
        class="flex-1 px-4 py-2.5 text-sm font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-xl transition-colors">
        {{ state.cancelLabel || 'Cancel' }}
      </button>
      <button (click)="confirm(true)"
        class="flex-1 px-4 py-2.5 text-sm font-semibold text-white rounded-xl transition-colors shadow-lg"
        [class.bg-red-600]="state.danger" [class.hover:bg-red-700]="state.danger" [class.shadow-red-200]="state.danger"
        [class.bg-indigo-600]="!state.danger" [class.hover:bg-indigo-700]="!state.danger"
        [class.shadow-indigo-200]="!state.danger">
        {{ state.confirmLabel || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
}
