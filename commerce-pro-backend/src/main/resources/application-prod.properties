# =============================================
# Production Profile — Render Deployment
# =============================================
# Activated by: SPRING_PROFILES_ACTIVE=prod  (set in Render env vars)
spring.config.import=optional:classpath:application-identity.properties

# =============================================
# Server
# =============================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# =============================================
# PostgreSQL Database  (Render Postgres add-on)
# Render sets DATABASE_URL automatically when you link a PostgreSQL database.
# =============================================
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Disable H2 console
spring.h2.console.enabled=false

# =============================================
# CORS  — allow your Render frontend origins
# Set CORS_ALLOWED_ORIGINS in Render env vars,
# e.g.: https://commerce-pro-admin.onrender.com
# =============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://commerce-pro-admin.onrender.com}

# =============================================
# File Uploads
# Render ephemeral filesystem — for persistent uploads use S3/Cloudinary.
# These settings keep the app bootable; replace upload logic with cloud storage.
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.file.upload-dir=/tmp/uploads
app.file.access-url=/uploads

# =============================================
# Application URLs
# =============================================
app.frontend.url=${FRONTEND_URL:https://commerce-pro-admin.onrender.com}
app.payment.payment-link-base-url=${PAYMENT_LINK_BASE_URL:https://commerce-pro-admin.onrender.com/pay}

# =============================================
# Security — change all defaults in production!
# =============================================
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.debug=false

# =============================================
# Spring Mail
# =============================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============================================
# Spring AI — Groq
# =============================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.embedding.enabled=false

# =============================================
# AI Module
# =============================================
ai.models.fast=llama-3.1-8b-instant
ai.models.balanced=llama-3.3-70b-versatile
ai.models.powerful=llama-3.3-70b-versatile
ai.max-tokens-cap=4096
ai.budget.daily-total-usd=${AI_DAILY_BUDGET_USD:10.00}
ai.timeout.connect-ms=5000
ai.timeout.read-ms=30000
ai.rate-limit.calls-per-minute=200
ai.rate-limit.calls-per-hour=5000
ai.retry.max-attempts=3
ai.retry.backoff-ms=1000
ai.session.chatbot-ttl-hours=24
ai.session.report-ttl-hours=2
ai.jobs.nightly-forecast.enabled=true
ai.jobs.weekly-churn.enabled=true
ai.jobs.weekly-inventory.enabled=true
ai.jobs.monthly-budget.enabled=true
ai.jobs.monthly-vendor.enabled=true

# =============================================
# Payment encryption
# =============================================
app.payment.encryption-key=${PAYMENT_ENCRYPTION_KEY}
app.payment.default-currency=USD
app.payment.auth-hold-days=7

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# =============================================
# Pagination
# =============================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# =============================================
# Rate Limiting
# =============================================
app.rate-limit.auth.max-requests=${RATE_LIMIT_MAX_REQUESTS:20}
app.rate-limit.auth.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# =============================================
# Jackson
# =============================================
spring.jackson.serialization.indent-output=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
